# 交易复盘工具默认配置
# 业务参数：指标、窗口、阈值
# 功能性配置（代理、交易所端点）在 tools/config.py 中以常量形式定义

# ------ 数据获取 ------
data:
  default_exchange: binance
  default_market: futures            # binance USDT-M 永续
  default_quote: USDT
  # 预热长度（根数）：EMA200 + Wave Filter 合计需要足够历史才能稳定
  warmup_bars: 600
  # 显示窗口（围绕分析中心 K 线 左右各取多少根用于图表）
  display_bars_before: 180
  display_bars_after: 20
  timezone: Asia/Shanghai            # 全局 UTC+8

# ------ EMA 均线组 ------
ema:
  periods: [21, 55, 100, 200]
  colors:                            # 对齐 TradingView 常见配色
    21:  "#f6c244"
    55:  "#2962ff"
    100: "#ff6d00"
    200: "#d500f9"

# ------ Wave Filter（StochRSI 变种） ------
# 与 pinescript指标/超买超卖过滤器.pine 完全一致
wave_filter:
  rsi_period: 14
  stoch_period: 14
  smooth_k: 3
  smooth_d: 3
  ma_type: SMA                       # 默认 SMA，Pine 支持 SMA/EMA/RMA/WMA
  overbought: 40
  oversold: -40
  source: close

# ------ K 线形态特征阈值 ------
features:
  long_wick_ratio: 0.5               # 影线占全幅 >50% 视为长影线
  strong_body_ratio: 0.7             # 实体占全幅 >70% 视为强实体
  vol_spike_multiple: 2.0            # 成交量 > 近20根均值 * 2 视为放量

# ------ 图表绘制 ------
chart:
  candle_up_color:   "#26a69a"
  candle_down_color: "#ef5350"
  entry_color: "#2196f3"
  stop_color:  "#ef5350"
  take_color:  "#26a69a"
  profit_zone_color: "rgba(38,166,154,0.15)"
  loss_zone_color:   "rgba(239,83,80,0.15)"
  highlight_color:   "rgba(255,235,59,0.35)"

# ------ 订单流 (Delta / CVD) ------
# 按需拉取，不影响默认复盘流程
orderflow:
  default_window: 10       # 锚定 K 前后各 N 根 K 线拉取 trades
  trades_limit: 1000       # 每次 fetch_trades 返回上限（binance 最大 1000）
  # 数据源策略（hybrid 推荐：bar-level delta/cvd 永远来自 klines.taker_buy_base；
  # 仅命中钩子的热点 bar 才拉 aggTrades 以保留微观证据）
  default_mode: hybrid     # klines | hybrid | full
  default_buffer_bars: 2   # 热点 bar 前后各 ±N 根一并纳入 aggTrades
  default_hooks:           # 默认开启的钩子列表
    - anchor               # 锚 K 必含
    - long_upper_wick      # upper_wick_ratio ≥ 0.4
    - long_lower_wick      # lower_wick_ratio ≥ 0.4
    - absorption_candidate # 阳线+Δ负 / 阴线+Δ正，且 |Δ|/vol ≥ 0.05
    - engulf               # bull/bear engulf
    - wave_extreme         # |wave| ≥ 40
  # 钩子阈值（与 bar_features 默认值保持一致；如需更敏感可调低）
  hook_thresholds:
    long_wick: 0.4
    absorption_delta_pct: 0.05  # |delta| / volume 比值
    wave_extreme: 40
    high_volume: 1.5

# ------ 成交量分布 (Volume Profile) ------
# 窗口规则**禁止**临时调整以避免事后挑窗口讲故事；
# 计算逻辑见 tools/volume_profile.py。
volume_profile:
  n_bins: 80               # 价格分箱数（自适应粒度的关键）
  va_pct: 0.70             # Value Area 覆盖的成交量占比
  hvn_quantile: 0.80       # HVN 阈值：vol ≥ 该分位且为本地峰值
  lvn_quantile: 0.20       # LVN 阈值：vol ≤ 该分位且为本地谷值
  # 单笔模式：锚 K ±N 根（建议 ≥ orderflow.default_window，给 VP 更多样本）
  single_anchor_window: 20
  # 日级模式：使用整个 session（B00-B95）
  # 价格范围统一从数据自适应（min(low) / max(high)），不在 config 里固定

# ------ 编号方案 ------
indexing:
  prefix: A                          # K 线编号前缀，如 A001, A002
  width: 3                           # 数字位宽
